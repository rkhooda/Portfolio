<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Multiagent Builder: nine agents in sequence, four human gates. A
       signal walks the pipeline, lights each agent, and waits at every gate
       until it opens. Generated by a script: the timings must agree. -->
  <style>
    .n     { fill: #131513; stroke: #7e827a; stroke-width: 4; animation: 13s steps(1,end) infinite; }
    .g     { stroke: #7e827a; stroke-width: 8; stroke-linecap: round; animation: 13s cubic-bezier(.2,.9,.3,1) infinite; }
    .pulse { offset-path: path("M300 536 L425 590 L550 569 L675 490 L800 420 L925 417 L1050 483 L1175 564 L1300 591 L1390 591"); offset-rotate: 0deg; animation: pulse 13s linear infinite; }
    .burst { transform-box: fill-box; transform-origin: center; animation: burst 13s ease-out infinite; }
        @keyframes pulse {
      0.00% { offset-distance: 0.00%; opacity: 0; }
      3.00% { offset-distance: 0.00%; opacity: 1; }
      3.00% { offset-distance: 0.00%; opacity: 1; }
      7.82% { offset-distance: 11.47%; opacity: 1; }
      10.06% { offset-distance: 16.81%; opacity: 1; }
      17.06% { offset-distance: 16.81%; opacity: 1; }
      19.30% { offset-distance: 22.15%; opacity: 1; }
      21.91% { offset-distance: 28.36%; opacity: 1; }
      28.91% { offset-distance: 28.36%; opacity: 1; }
      31.52% { offset-distance: 34.58%; opacity: 1; }
      34.06% { offset-distance: 40.62%; opacity: 1; }
      41.06% { offset-distance: 40.62%; opacity: 1; }
      43.60% { offset-distance: 46.66%; opacity: 1; }
      48.02% { offset-distance: 57.19%; opacity: 1; }
      53.03% { offset-distance: 69.12%; opacity: 1; }
      58.29% { offset-distance: 81.64%; opacity: 1; }
      62.82% { offset-distance: 92.42%; opacity: 1; }
      66.00% { offset-distance: 100.00%; opacity: 1; }
      73.00% { offset-distance: 100.00%; opacity: 1; }
      77.00% { offset-distance: 100.00%; opacity: 0; }
      100.00% { offset-distance: 100.00%; opacity: 0; }
    }
    @keyframes n0 { 0%,1.80% { fill: #131513; stroke: #7e827a; } 3.00%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n1 { 0%,6.62% { fill: #131513; stroke: #7e827a; } 7.82%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n2 { 0%,18.10% { fill: #131513; stroke: #7e827a; } 19.30%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n3 { 0%,30.32% { fill: #131513; stroke: #7e827a; } 31.52%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n4 { 0%,42.40% { fill: #131513; stroke: #7e827a; } 43.60%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n5 { 0%,46.82% { fill: #131513; stroke: #7e827a; } 48.02%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n6 { 0%,51.83% { fill: #131513; stroke: #7e827a; } 53.03%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n7 { 0%,57.09% { fill: #131513; stroke: #7e827a; } 58.29%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes n8 { 0%,61.62% { fill: #131513; stroke: #7e827a; } 62.82%,90% { fill: #a8b58a; stroke: #a8b58a; } 96%,100% { fill: #131513; stroke: #7e827a; } }
    @keyframes gl0 { 0%,12.26% { transform: translateX(0); stroke: #7e827a; } 14.26%,90% { transform: translateX(-20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gr0 { 0%,12.26% { transform: translateX(0); stroke: #7e827a; } 14.26%,90% { transform: translateX(20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gl1 { 0%,24.11% { transform: translateX(0); stroke: #7e827a; } 26.11%,90% { transform: translateX(-20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gr1 { 0%,24.11% { transform: translateX(0); stroke: #7e827a; } 26.11%,90% { transform: translateX(20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gl2 { 0%,36.26% { transform: translateX(0); stroke: #7e827a; } 38.26%,90% { transform: translateX(-20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gr2 { 0%,36.26% { transform: translateX(0); stroke: #7e827a; } 38.26%,90% { transform: translateX(20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gl3 { 0%,68.20% { transform: translateX(0); stroke: #7e827a; } 70.20%,90% { transform: translateX(-20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes gr3 { 0%,68.20% { transform: translateX(0); stroke: #7e827a; } 70.20%,90% { transform: translateX(20px); stroke: #a8b58a; } 96%,100% { transform: translateX(0); stroke: #7e827a; } }
    @keyframes burst { 0%,73.00% { transform: scale(.2); opacity: 0; } 74.50% { opacity: .6; } 82.00%,100% { transform: scale(3); opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .n, .g, .pulse, .burst { animation: none; }
      .n { fill: #a8b58a; stroke: #a8b58a; } .pulse { display: none; }
    }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="halo" cx="800" cy="500" r="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8b58a" stop-opacity="0.09"/>
      <stop offset="1" stop-color="#a8b58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>

  <path d="M300 536 L425 590 L550 569 L675 490 L800 420 L925 417 L1050 483 L1175 564 L1300 591 L1390 591" fill="none" stroke="#eaeae2" stroke-opacity="0.16" stroke-width="4"/>
    <g><line class="g" style="animation-name:gl0" x1="480" y1="543" x2="480" y2="615"/><line class="g" style="animation-name:gr0" x1="494" y1="543" x2="494" y2="615"/></g>
    <g><line class="g" style="animation-name:gl1" x1="606" y1="493" x2="606" y2="565"/><line class="g" style="animation-name:gr1" x1="620" y1="493" x2="620" y2="565"/></g>
    <g><line class="g" style="animation-name:gl2" x1="730" y1="419" x2="730" y2="491"/><line class="g" style="animation-name:gr2" x1="744" y1="419" x2="744" y2="491"/></g>
    <g><line class="g" style="animation-name:gl3" x1="1383" y1="555" x2="1383" y2="627"/><line class="g" style="animation-name:gr3" x1="1397" y1="555" x2="1397" y2="627"/></g>
    <circle class="n" style="animation-name:n0" cx="300" cy="536" r="22"/>
    <circle class="n" style="animation-name:n1" cx="425" cy="590" r="22"/>
    <circle class="n" style="animation-name:n2" cx="550" cy="569" r="22"/>
    <circle class="n" style="animation-name:n3" cx="675" cy="490" r="22"/>
    <circle class="n" style="animation-name:n4" cx="800" cy="420" r="22"/>
    <circle class="n" style="animation-name:n5" cx="925" cy="417" r="22"/>
    <circle class="n" style="animation-name:n6" cx="1050" cy="483" r="22"/>
    <circle class="n" style="animation-name:n7" cx="1175" cy="564" r="22"/>
    <circle class="n" style="animation-name:n8" cx="1300" cy="591" r="22"/>
  <circle class="burst" cx="1390" cy="591" r="52" fill="none" stroke="#a8b58a" stroke-width="4"/>
  <g class="pulse">
    <circle r="32" fill="#a8b58a" opacity="0.22"/>
    <circle r="12" fill="#e6ecd6"/>
  </g>
</svg>
