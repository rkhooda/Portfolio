<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Developer Brain: the vault's graph view. Notes and links drift; twice
       a loop a new note lands, links in, and its neighbourhood lights up.
       Generated by a script: layout, links and timings agree. -->
  <style>
    .graph { transform-origin: 800px 500px; animation: drift 16s ease-in-out infinite alternate; }
    .links line { stroke: #eaeae2; stroke-opacity: .22; stroke-width: 1.6; }
    .notes circle { fill: #7c8278; }
    .nl { stroke: #a8b58a; stroke-width: 2.2; stroke-dasharray: 1; stroke-dashoffset: 1; animation: 12s cubic-bezier(.4,0,.2,1) infinite; }
    .nn { fill: #cfd8b8; transform-box: fill-box; transform-origin: center; transform: scale(0); animation: 12s cubic-bezier(.2,1.4,.4,1) infinite; }
    @keyframes drift   { from { transform: rotate(-1.4deg) scale(1); } to { transform: rotate(1.4deg) scale(1.035); } }
    @keyframes twinkle { from { opacity: .55; } to { opacity: 1; } }
    .notes circle { animation-direction: normal,alternate; }
    @keyframes new0 { 0%,7.99% { transform: scale(0); } 10.5% { transform: scale(1.5); } 12%,92% { transform: scale(1); } 96%,100% { transform: scale(0); } }
    @keyframes link0 { 0%,10% { stroke-dashoffset: 1; opacity: 1; } 17%,92% { stroke-dashoffset: 0; opacity: 1; } 96%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes lit0 { 0%,15% { fill: #7c8278; } 17%,38% { fill: #a8b58a; } 44%,100% { fill: #7c8278; } }
    @keyframes dim0 { 0%,17% { fill: #7c8278; } 19%,34% { fill: #98a288; } 40%,100% { fill: #7c8278; } }
    @keyframes new1 { 0%,53.99% { transform: scale(0); } 56.5% { transform: scale(1.5); } 58%,92% { transform: scale(1); } 96%,100% { transform: scale(0); } }
    @keyframes link1 { 0%,56% { stroke-dashoffset: 1; opacity: 1; } 63%,92% { stroke-dashoffset: 0; opacity: 1; } 96%,100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes lit1 { 0%,61% { fill: #7c8278; } 63%,84% { fill: #a8b58a; } 90%,100% { fill: #7c8278; } }
    @keyframes dim1 { 0%,63% { fill: #7c8278; } 65%,80% { fill: #98a288; } 86%,100% { fill: #7c8278; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .nn { transform: scale(1); } .nl { stroke-dashoffset: 0; } }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="halo" cx="800" cy="500" r="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a8b58a" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a8b58a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#halo)"/>

