<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1600 1000">
  <!-- FlowPane: the pane collapsed to the screen edge, still watching. -->
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="warm" cx="1500" cy="520" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffb03b" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#ffb03b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="white" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="0.65" stop-color="#dcd2bb"/>
      <stop offset="1" stop-color="#b3a78d"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2a2521"/>
      <stop offset="1" stop-color="#110f0d"/>
    </radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaeae2" stop-opacity="0.11"/>
      <stop offset="1" stop-color="#eaeae2" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="frost" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="9"/></filter>
    <filter id="glow" x="-400%" y="-10%" width="900%" height="120%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.9  0 0 0 0 0.9  0 0 0 0 0.85  0 0 0 0.08 0"/>
    </filter>
    <path id="pane" d="M1478 120 h200 v760 h-200 a28 28 0 0 1 -28 -28 v-704 a28 28 0 0 1 28 -28 z"/>
    <clipPath id="paneClip"><use href="#pane"/></clipPath>

    <g id="eyes">
      <!-- cast shadow -->
      <ellipse cx="1270" cy="690" rx="330" ry="80" fill="#000" opacity="0.5" filter="url(#soft)"/>
      <!-- left eye -->
      <g transform="translate(1146 522) rotate(-7) scale(1.28)">
        <ellipse rx="112" ry="124" fill="url(#white)" stroke="#1a1713" stroke-opacity="0.45" stroke-width="3"/>
        <circle cx="-34" cy="24" r="50" fill="url(#pupil)"/>
        <circle cx="-52" cy="4" r="9" fill="#fff" opacity="0.8"/>
      </g>
      <!-- right eye: a touch bigger, a touch higher -->
      <g transform="translate(1392 498) rotate(5) scale(1.28)">
        <ellipse rx="126" ry="140" fill="url(#white)" stroke="#1a1713" stroke-opacity="0.45" stroke-width="3"/>
        <circle cx="-38" cy="28" r="56" fill="url(#pupil)"/>
        <circle cx="-58" cy="6" r="10" fill="#fff" opacity="0.8"/>
      </g>
    </g>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#warm)"/>

  <use href="#eyes"/>

  <!-- the pane: frosted copy of whatever sits behind it, then the glass itself -->
  <use href="#eyes" clip-path="url(#paneClip)" filter="url(#frost)" opacity="0.7"/>
  <use href="#pane" fill="#0b0c0b" opacity="0.42"/>
  <use href="#pane" fill="url(#glass)" stroke="#eaeae2" stroke-opacity="0.18" stroke-width="2"/>
  <!-- snapped edge: a hair of amber light -->
  <rect x="1449" y="150" width="3" height="700" rx="1.5" fill="#ffb03b" opacity="0.55" filter="url(#glow)"/>
  <rect x="1449" y="150" width="2" height="700" rx="1" fill="#ffc46a" opacity="0.7"/>
  <!-- grab handle -->
  <rect x="1508" y="468" width="8" height="64" rx="4" fill="#eaeae2" opacity="0.28"/>

  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.6"/>
</svg>
