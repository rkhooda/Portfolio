<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- FlowPane: the eyes from the logo, loose in the frame. Still watching. -->
  <style>
    .wander { transform-origin: 800px 500px; animation: wander 26s cubic-bezier(.3,1.25,.4,1) infinite; }
    .bob    { animation: bob 3.6s ease-in-out infinite alternate; }
    .look   { animation: look 9s cubic-bezier(.3,0,.1,1) infinite; }
    .lid    { animation: blink 6.4s ease-in infinite; }
    /* inline in the page, main.js feeds --gx/--gy and the pupils track the
       cursor instead of glancing on their own; as a plain image both are inert */
    .gaze   { transform: translate(var(--gx, 0px), var(--gy, 0px)); transition: transform .35s cubic-bezier(.2,.8,.2,1); }
    body.gazing .look { animation: none; }
    @keyframes wander {
      0%,13%   { transform: translate(0,0)          rotate(0deg); }
      15%,29%  { transform: translate(380px,-40px)  rotate(3deg); }
      31%,45%  { transform: translate(-370px,70px)  rotate(-4deg); }
      47%,61%  { transform: translate(30px,-190px)  rotate(2deg); }
      63%,77%  { transform: translate(-50px,190px)  rotate(-2deg); }
      79%,93%  { transform: translate(350px,150px)  rotate(3deg); }
      95%,100% { transform: translate(0,0)          rotate(0deg); }
    }
    @keyframes bob { from { transform: translateY(-10px); } to { transform: translateY(10px); } }
    @keyframes look {
      0%,16%  { transform: translate(-34px,22px); }
      21%,42% { transform: translate(26px,10px); }
      47%,64% { transform: translate(2px,-26px); }
      69%,86% { transform: translate(-30px,-6px); }
      91%,100%{ transform: translate(-34px,22px); }
    }
    /* lid rests above the eye; a blink is ~140ms down, ~180ms up, twice on the second pass */
    @keyframes blink {
      0%,38%   { transform: translateY(-300px); }
      40.5%    { transform: translateY(0); }
      43.5%,81%{ transform: translateY(-300px); }
      83%      { transform: translateY(0); }
      85.5%    { transform: translateY(-300px); }
      87.5%    { transform: translateY(0); }
      90%,100% { transform: translateY(-300px); }
    }
    @media (prefers-reduced-motion: reduce) { .wander, .bob, .look, .lid { animation: none; } }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="shade">
      <stop offset="0" stop-color="#000" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="white" cx="0.36" cy="0.3" r="0.78">
      <stop offset="0" stop-color="#f6efe0"/>
      <stop offset="0.65" stop-color="#dcd2bb"/>
      <stop offset="1" stop-color="#b3a78d"/>
    </radialGradient>
    <radialGradient id="pupil" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#2a2521"/>
      <stop offset="1" stop-color="#110f0d"/>
    </radialGradient>
    <clipPath id="eyeL"><ellipse rx="113" ry="125"/></clipPath>
    <clipPath id="eyeR"><ellipse rx="127" ry="141"/></clipPath>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>

  <g class="wander"><g class="bob">
    <ellipse cx="800" cy="700" rx="330" ry="80" fill="url(#shade)"/>

    <g class="eye" transform="translate(676 522) rotate(-7) scale(1.28)">
      <ellipse rx="112" ry="124" fill="url(#white)" stroke="#1a1713" stroke-opacity="0.45" stroke-width="3"/>
      <g class="gaze"><g class="look">
        <circle r="50" fill="url(#pupil)"/>
        <circle cx="-18" cy="-20" r="9" fill="#fff" opacity="0.8"/>
      </g></g>
      <g clip-path="url(#eyeL)"><ellipse class="lid" rx="118" ry="130" fill="#121311"/></g>
    </g>

    <g class="eye" transform="translate(922 500) rotate(5) scale(1.28)">
      <ellipse rx="126" ry="140" fill="url(#white)" stroke="#1a1713" stroke-opacity="0.45" stroke-width="3"/>
      <g class="gaze"><g class="look">
        <circle r="56" fill="url(#pupil)"/>
        <circle cx="-20" cy="-22" r="10" fill="#fff" opacity="0.8"/>
      </g></g>
      <g clip-path="url(#eyeR)"><ellipse class="lid" rx="132" ry="146" fill="#121311"/></g>
    </g>
  </g></g>
</svg>
