<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- Clixo: the six-wedge mark. The wedges fly in and lock, a ring clicks
       out of the centre, then it holds. -->
  <style>
    .v, .d { animation: 7s cubic-bezier(.2,1.35,.3,1) infinite; opacity: 0; }
    .v { animation-name: flyV; }
    .d { animation-name: flyD; }
    .w:nth-child(2) .v, .w:nth-child(2) .d { animation-delay: .07s; }
    .w:nth-child(3) .v, .w:nth-child(3) .d { animation-delay: .14s; }
    .w:nth-child(4) .v, .w:nth-child(4) .d { animation-delay: .04s; }
    .w:nth-child(5) .v, .w:nth-child(5) .d { animation-delay: .18s; }
    .w:nth-child(6) .v, .w:nth-child(6) .d { animation-delay: .11s; }
    .click { transform: scale(.2); opacity: 0; animation: click 7s ease-out infinite; }
    @keyframes flyV {
      0%       { transform: translateY(-170px); opacity: 0; }
      19%,86%  { transform: translateY(0);      opacity: 1; }
      93%,100% { transform: translateY(-50px);  opacity: 0; }
    }
    @keyframes flyD {
      0%       { transform: translate(-120px,-120px); opacity: 0; }
      19%,86%  { transform: translate(0,0);           opacity: 1; }
      93%,100% { transform: translate(-36px,-36px);   opacity: 0; }
    }
    @keyframes click {
      0%,20%   { transform: scale(.2); opacity: 0; }
      22%      { opacity: .55; }
      40%,100% { transform: scale(2.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .v, .d, .click { animation: none; }
      .v, .d { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="800" cy="500" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#eaeae2" stop-opacity="0.07"/>
      <stop offset="1" stop-color="#eaeae2" stop-opacity="0"/>
    </radialGradient>
    <!-- one vertical wedge and one diagonal arm; the rest are mirrors -->
    <polygon id="wv" points="-46,-212 46,-212 10,-50 -10,-50"/>
    <polygon id="wd" points="-192,-130 -94,-130 -18,-36 -36,-18"/>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <g transform="translate(800 500) scale(1.25)">
    <circle class="click" r="230" fill="none" stroke="#eaeae2" stroke-width="3"/>
    <g class="mark" fill="#eaeae2">
      <g class="w"><use class="v" href="#wv"/></g>
      <g class="w" transform="rotate(180)"><use class="v" href="#wv"/></g>
      <g class="w"><use class="d" href="#wd"/></g>
      <g class="w" transform="scale(-1 1)"><use class="d" href="#wd"/></g>
      <g class="w" transform="scale(1 -1)"><use class="d" href="#wd"/></g>
      <g class="w" transform="scale(-1 -1)"><use class="d" href="#wd"/></g>
    </g>
  </g>
</svg>
