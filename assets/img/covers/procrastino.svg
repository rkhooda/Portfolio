<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <!-- ProcrastiNO: the mascot render, cut out. It breathes and sways, and
       every few seconds jumps. Shown through an image tag the render can't
       load, so only the ground shows until main.js inlines the file. -->
  <style>
    .hop    { transform-origin: 797px 832px; animation: hop 7s cubic-bezier(.3,0,.2,1) infinite; }
    .sway   { transform-origin: 797px 832px; animation: sway 3.4s ease-in-out infinite alternate; }
    .char   { transform-origin: 797px 832px; animation: breathe 1.9s ease-in-out infinite alternate; }
    .shadow { transform-origin: 797px 840px; animation: shadow 7s cubic-bezier(.3,0,.2,1) infinite; }
    .halo   { animation: halo 1.9s ease-in-out infinite alternate; }
    @keyframes breathe { from { transform: scale(1,1); } to { transform: scale(1.022,.978); } }
    @keyframes sway    { from { transform: rotate(-1.6deg); } to { transform: rotate(1.6deg); } }
    @keyframes halo    { from { opacity: .7; } to { opacity: 1; } }
    /* the jump: crouch, spring with a lean, land, settle */
    @keyframes hop {
      0%,55%   { transform: translateY(0) rotate(0); }
      58%      { transform: translateY(16px) scale(1.04,.94); }
      62%      { transform: translateY(-96px) rotate(-5deg) scale(.97,1.05); }
      66%      { transform: translateY(0) rotate(0) scale(1.03,.96); }
      68%      { transform: translateY(0) scale(1,1); }
      70%,100% { transform: translateY(0) rotate(0); }
    }
    @keyframes shadow { 0%,57% { transform: scale(1); opacity: 1; } 62% { transform: scale(.7); opacity: .5; } 66%,100% { transform: scale(1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181916"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <radialGradient id="glow" cx="797" cy="520" r="520" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ff8a3c" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade">
      <stop offset="0" stop-color="#000" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="1000" fill="url(#ground)"/>
  <rect class="halo" width="1600" height="1000" fill="url(#glow)"/>
  <ellipse class="shadow" cx="797" cy="840" rx="255" ry="32" fill="url(#shade)"/>

  <g class="hop"><g class="sway"><g class="char">
    <image href="assets/img/covers/procrastino-logo.webp" x="335" y="110" width="930" height="776"/>
  </g></g></g>
</svg>
